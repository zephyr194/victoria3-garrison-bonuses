l_english:
 building_gs_garrison:0 "Garrison Compound"
 building_gs_garrison_desc:0 "Fixed local security jobs, not field battalions. Monthly staff and supply checks reduce turmoil penalties. Direct deradicalization is not enabled in this experimental build. No direct loyalist gain."
 pmg_gs_service:0 "Garrison Service"
 pm_gs_active:0 "Standing Garrison"
 pm_gs_active_desc:0 "Order follows employed staff. Security qualification requires at least 20% coverage. Direct deradicalization is not enabled in this experimental build. This mode earns no civic qualification."
 pm_gs_civic:0 "Civic Service"
 pm_gs_civic_desc:0 "Adds grain, fabric, paper and services. Civic qualification requires 50% coverage, incorporation, low turmoil and adequate living conditions. Currently records civic qualification only; provides no direct loyalist gain yet."
 pm_gs_standby:0 "Mothballed Compound"
 pm_gs_standby_desc:0 "No jobs or benefits. Reserves 2 infrastructure per level until demolished. Qualification resets after 2 interrupted monthly checks."
 gs_order_1:0 "Local Garrison Order (5.00%)"
 gs_order_1_desc:0 "Reduces turmoil penalties, not the turmoil rate. Replaced monthly; closure, shortages or loss of control clear it on the next check. This is the compound contribution, not the final combined relief from all sources."
