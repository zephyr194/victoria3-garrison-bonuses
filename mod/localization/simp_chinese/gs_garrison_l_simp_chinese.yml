l_simp_chinese:
 building_gs_garrison:0 "卫戍营区"
 building_gs_garrison_desc:0 "固定地方卫戍岗位，不生成野战部队。按月检查人员与军需，减轻动乱惩罚。本实验版本未启用直接去激进效果。当前不直接增加忠诚人口。"
 pmg_gs_service:0 "卫戍勤务"
 pm_gs_active:0 "常备卫戍"
 pm_gs_active_desc:0 "按实际就业维持秩序；覆盖至少20%时积累去激进资格。本实验版本未启用直接去激进效果。常备卫戍不积累军民服务资格。"
 pm_gs_civic:0 "军民服务"
 pm_gs_civic_desc:0 "额外投入粮食、布料、纸张及服务；覆盖至少50%且整合、动乱与生活条件达标时积累军民服务资格。当前仅记录军民服务资格，暂不提供直接增加忠诚人口的收益。"
 pm_gs_standby:0 "封存营区"
 pm_gs_standby_desc:0 "关闭岗位与治理收益。每级仍预留2基础设施；拆除后释放。停运连续2次月检后资格清零。"
 gs_order_1:0 "地方驻军维持秩序 (5.00%)"
 gs_order_1_desc:0 "减轻动乱惩罚，不直接降低动乱率。每月替换修正；停工、短缺或失控在下次月检清理。此数值为营区自身减免，不代表所有治安来源的最终合计。"
