name: Garrison static and model checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/generate.py --check
      - run: python tools/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package.py --target 1.13 --experimental
      - run: python scripts/package.py --target 1.14 --experimental
